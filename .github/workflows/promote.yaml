name: promote

on:
  workflow_dispatch:                 # ← запуск только вручную (кнопка / gh workflow run)
    inputs:
      to:
        description: "Куда продвигаем артефакт"
        required: true
        type: choice
        options: [stage, prod]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.to }}    # ← ВОРОТА: GitHub Environment с required reviewers
    steps:
      - uses: actions/checkout@v4
      - name: Продвинуть тег из предыдущего окружения
        run: |
          set -euo pipefail
          case "${{ inputs.to }}" in
            stage) from=dev   ;;
            prod)  from=stage ;;
          esac
          tag=$(grep -E '^[[:space:]]+tag:' shop/values-$from.yaml | awk '{print $2}')
          echo "Промоушен: $from ($tag) -> ${{ inputs.to }}"
          sed -i "s|^  tag: .*|  tag: $tag|" shop/values-${{ inputs.to }}.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "promote($from -> ${{ inputs.to }}): $tag"
          git push
