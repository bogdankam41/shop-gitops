name: build-and-deploy

on:
  push:
    branches: [main]
    paths: ['app/**']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:                                        # ← НОВАЯ джоба, идёт первой
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Линт Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint < app/Dockerfile
      - name: Установить helm (офиц. скрипт, не угадываем тег action)
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Линт и рендер чарта по всем окружениям
        run: |
          helm lint shop -f shop/values-prod.yaml
          for e in dev stage prod; do
            helm template shop -f shop/values-$e.yaml >/dev/null
          done

  build:
    needs: test                              # ← ворота: ждёт зелёный test
    if: github.event_name == 'push'          # ← на PR не собираем, только тестируем
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shop-app:${{ github.sha }}

      - name: Скан образа (валим на CRITICAL)
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity CRITICAL --exit-code 1 --no-progress \
            ghcr.io/${{ github.repository_owner }}/shop-app@${{ steps.build.outputs.digest }}

      - name: Установить cosign
        uses: sigstore/cosign-installer@v3

      - name: Подпись образа ключом (офлайн-проверяемая)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --yes \
            ghcr.io/${{ github.repository_owner }}/shop-app@${{ steps.build.outputs.digest }}

      - name: Промоушен в DEV (bump тега только у dev)
        run: |
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" shop/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "ci(dev): образ ${{ github.sha }} [skip ci]"
          git push
