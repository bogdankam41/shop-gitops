name: build-and-deploy

on:
  push:
    branches: [main]
    paths: ['app/**']

permissions:
  contents: write
  packages: write
  id-token: write          # для keyless-подписи по OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shop-app:${{ github.sha }}

      - name: Скан образа (валим сборку на CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/shop-app@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: '1'

      - name: Установить cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless-подпись образа (по OIDC пайплайна)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/shop-app@${{ steps.build.outputs.digest }}

      - name: Обновить тег в чарте
        run: |
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" shop/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: образ ${{ github.sha }} [skip ci]"
          git push
