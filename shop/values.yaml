replicaCount: 1
image:
  repository: ghcr.io/bogdankam41/shop-app
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 64Mi
ingress:
  host: dev.shop.local
networkPolicy:
  enabled: false
  denyEgress: false
ghcrPull:
  sealed: false
pdb:
  enabled: true
  maxUnavailable: 1
limitRange:
  enabled: true
  default: {cpu: 500m, memory: 64Mi}
  defaultRequest: {cpu: 25m, memory: 32Mi}
  max: {cpu: "1", memory: 128Mi}
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "200m"
    requests.memory: 256Mi
    limits.cpu: "2"
    limits.memory: 256Mi
    pods: "6"
