# Секреты lab-data: Vault (kv/lab-data/*) → ESO → Secret.
#
# Идентичность для Vault — не SA самого ESO, а SA в namespace арендатора:
# ClusterSecretStore без serviceAccountRef.namespace берёт SA из namespace
# ExternalSecret, а роль Vault `lab-data` привязана к lab-data/eso-vault и
# видит только kv/lab-data/*. Одно хранилище на кластер, изоляция — в Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault
  namespace: lab-data
automountServiceAccountToken: false   # токен выпускает ESO через TokenRequest
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  conditions:
    - namespaces: [lab-data]          # кто вообще может ссылаться на хранилище
  provider:
    vault:
      server: http://vault-active.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: lab-data
          serviceAccountRef:
            name: eso-vault
            audiences: [vault]        # токен с audience только для Vault
---
# Владелец БД dwh — bootstrap initdb.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-app
  namespace: lab-data
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: pg-app
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef: { key: lab-data/pg-app, property: username }
    - secretKey: password
      remoteRef: { key: lab-data/pg-app, property: password }
---
# Роль только на чтение (BI). Пароль ротируется: правка в Vault → ESO
# обновляет Secret → CNPG (managed roles) делает ALTER ROLE.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-reporting
  namespace: lab-data
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: pg-reporting
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"      # оператор следит за изменениями секрета
  data:
    - secretKey: username
      remoteRef: { key: lab-data/pg-reporting, property: username }
    - secretKey: password
      remoteRef: { key: lab-data/pg-reporting, property: password }
---
# Ключи S3 (SeaweedFS) для архива WAL и бэкапов.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-cnpg
  namespace: lab-data
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: s3-cnpg
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: lab-data/s3-cnpg, property: access_key_id }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: lab-data/s3-cnpg, property: secret_access_key }
