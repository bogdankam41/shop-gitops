# PostgreSQL на CloudNativePG: primary + 1 реплика (streaming replication),
# автоматический failover, архив WAL и базовые бэкапы в S3 → PITR.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: seaweedfs
  namespace: lab-data
spec:
  retentionPolicy: 7d
  configuration:
    destinationPath: s3://cnpg-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
    s3Credentials:
      accessKeyId: { name: s3-cnpg, key: ACCESS_KEY_ID }
      secretAccessKey: { name: s3-cnpg, key: ACCESS_SECRET_KEY }
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-lab
  namespace: lab-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 2
  # Postgres реплицирует данные сам — вторая копия от Longhorn не нужна:
  # 1 реплика тома на инстанс, а отказоустойчивость даёт реплика PG на другой ноде.
  storage:
    size: 1Gi
    storageClass: longhorn-r1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
  bootstrap:
    initdb:
      database: dwh
      owner: app
      secret: { name: pg-app }
  managed:
    roles:
      - name: reporting
        ensure: present
        login: true
        inRoles: [pg_read_all_data]
        passwordSecret: { name: pg-reporting }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: seaweedfs
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required     # primary и реплика — строго на разных нодах
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-lab-daily
  namespace: lab-data
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "0 0 3 * * *"             # 6 полей: секунды первые
  immediate: true                     # первый бэкап сразу после создания
  backupOwnerReference: self
  cluster: { name: pg-lab }
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg-lab
  namespace: lab-data
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg-lab
  podMetricsEndpoints:
    - port: metrics
