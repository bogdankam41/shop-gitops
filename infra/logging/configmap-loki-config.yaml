apiVersion: v1
data:
  loki.yaml: "auth_enabled: false\nserver:\n  http_listen_port: 3100\ncommon:\n  instance_addr:\
    \ 127.0.0.1\n  path_prefix: /var/loki\n  storage:\n    filesystem:\n      chunks_directory:\
    \ /var/loki/chunks\n      rules_directory: /var/loki/rules\n  replication_factor:\
    \ 1\n  ring:\n    kvstore:\n      store: inmemory\nschema_config:\n  configs:\n\
    \    - from: 2024-04-01\n      store: tsdb\n      object_store: filesystem\n \
    \     schema: v13\n      index:\n        prefix: index_\n        period: 24h\n\
    limits_config:\n  retention_period: 72h\n  reject_old_samples: false\n  volume_enabled:\
    \ true\ncompactor:\n  working_directory: /var/loki/compactor\n  retention_enabled:\
    \ true\n  delete_request_store: filesystem\nanalytics:\n  reporting_enabled: false\n"
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging
