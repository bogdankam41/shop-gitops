apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: logging
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-10-03T12:01:54+03:00'
      labels:
        app: alloy
    spec:
      containers:
      - args:
        - run
        - /etc/alloy/config.alloy
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/var/lib/alloy/data
        image: grafana/alloy:latest
        imagePullPolicy: Always
        name: alloy
        resources:
          limits:
            memory: 192Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/alloy
          name: config
        - mountPath: /var/log/pods
          name: varlogpods
          readOnly: true
        - mountPath: /var/lib/alloy/data
          name: data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsUser: 0
      serviceAccount: alloy
      serviceAccountName: alloy
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: alloy-config
        name: config
      - hostPath:
          path: /var/log/pods
          type: ''
        name: varlogpods
      - emptyDir: {}
        name: data
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
